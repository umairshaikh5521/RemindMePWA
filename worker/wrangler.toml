name = "remind-me-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Cron trigger — fires every 5 minutes to dispatch due reminders
[triggers]
crons = ["*/5 * * * *"]

# D1 database — create with: wrangler d1 create remind-me-db
# Then replace the database_id below with the one wrangler prints
[[d1_databases]]
binding = "DB"
database_name = "remind-me-db"
database_id = "26789eed-d189-4b3e-952c-9e216d8569fb"

# Secrets (set via CLI, never committed):
#   wrangler secret put FIREBASE_PROJECT_ID
#   wrangler secret put FIREBASE_CLIENT_EMAIL
#   wrangler secret put FIREBASE_PRIVATE_KEY
